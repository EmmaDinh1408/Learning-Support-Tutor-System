limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;

upstream backend_instances {
    server backend:8000;
}

server {
    listen 80;
    server_name localhost;
    client_max_body_size 55M;

    # Stateless API routing with Rate Limiting
    location /api/ {
        limit_req zone=api_limit burst=60 nodelay;
        proxy_pass http://backend_instances;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /health {
        proxy_pass http://backend_instances/health;
    }

    location /docs {
        proxy_pass http://backend_instances/docs;
    }

    location /openapi.json {
        proxy_pass http://backend_instances/openapi.json;
    }

    # Serve built React frontend static files if mounted, or proxy to Vite
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
